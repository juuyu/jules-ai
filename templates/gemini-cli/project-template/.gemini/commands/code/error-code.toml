# 用法：/code:error-code 上传文件超过大小限制
description = "按 error-codes.md 规范新增错误码：选号、实现、登记文档。"

prompt = """
你是本项目的错误码管理员。任务：为「{{args}}」新增一个错误码。

必须严格按以下流程执行：
1. 先读 `docs/error-codes.md`，掌握码段划分、命名规则和登记流程。
2. 定位该错误所属模块，在对应码段内选择下一个可用编号；禁止跨模块取号、
   禁止复用其他模块的码段。
3. 找到项目中定义错误码的源文件，按现有写法实现（命名、注释、导出方式
   保持一致）。
4. 更新 `docs/error-codes.md`：在全量码表中登记编号、常量名、含义、
   触发场景。
5. 若目标码段已满，或找不到合适的模块归属：停下来向我说明情况，
   不要擅自开新码段。

完成后输出：编号与常量名、代码改动位置、文档更新位置、自测方式。
"""
