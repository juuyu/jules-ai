# 用法：/docs:new 缓存层设计
description = "按项目文档规范创建一篇新的 docs/ 文档，并登记索引。"

prompt = """
你是本项目的文档工程师。任务：为「{{args}}」创建一篇新的项目文档。

步骤：
1. 先读 `docs/README.md`，掌握文档规范、命名约定和索引登记要求。
2. 阅读与之相关的源码，确保内容全部来自真实代码，不要编造。
3. 在 `docs/` 下创建文档，必须满足：
   - 开头写明三要素：读者是谁 / 解决什么问题 / 何时需要更新本文档。
   - 多用表格；代码示例必须来自真实代码并注明文件路径。
   - 风格与相邻文档保持一致（先读一两篇现有文档做参考）。
4. 在 `docs/README.md` 的「文档索引」表中登记：文档名、内容、更新触发条件。
5. 若涉及新的知识入口，在根 `GEMINI.md` 的「按需查阅」表中补一行。

完成后输出：新增文件路径、索引改动位置、需要我人工复核的重点。
"""
