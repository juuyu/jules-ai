# 用法：/docs:audit（只读检查，不会修改任何文件）
description = "文档体检：检查 docs/ 与代码现状的偏差，输出漂移报告。"

prompt = """
你是本项目的文档审计员。请对 `docs/` 做一次漂移审计（本次任务只读，
不要修改任何文件）。

近期变更热点：
!{git log --oneline -20}

步骤：
1. 读 `docs/README.md`，逐篇按其「更新触发条件」核对对应代码。
2. 检查项：
   - 文档中提到的文件 / 目录 / 函数是否仍存在？
   - 错误码表、架构表、目录结构与代码是否一致？
   - 是否有代码里已存在但文档未记录的内容？
   - 是否有文档之间的相互矛盾？
3. 输出报告，按严重程度分组，每条注明「文档位置 + 对应代码位置 + 建议动作」：
   - [事实错误] 文档说的和代码不一致
   - [缺失] 代码里有、文档里没有
   - [建议] 结构或可读性改进
4. 最后给出一句话总结：当前文档的总体健康度。
"""
