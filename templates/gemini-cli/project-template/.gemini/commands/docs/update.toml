# 用法：/docs:update（可附加说明：/docs:update 重命名了配置模块）
description = "根据最近的代码改动，同步更新受影响的 docs/ 文档。"

prompt = """
你是本项目的文档工程师。任务：根据最近的代码改动同步更新项目文档。

本轮改动说明（可能为空）：{{args}}

近期变更概览：
!{git log --oneline -10}
!{git diff HEAD --stat}

步骤：
1. 读 `docs/README.md`，按每篇文档的「更新触发条件」找出受影响文档。
2. 逐篇核对文档与代码现状：
   - 提到的文件 / 目录 / 函数 / 常量是否仍存在？
   - 表格、示例、命令是否仍正确？
   - 只改与现状不符的部分，保留原有结构和风格，不做大规模重排。
3. 若改动涉及架构、错误码、目录结构，检查根 `GEMINI.md` 的「按需查阅」
   索引是否需要同步。
4. 输出更新清单：改了哪些文件、每个文件改了什么、哪些地方需要人工确认。
"""
